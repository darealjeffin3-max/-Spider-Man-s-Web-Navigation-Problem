<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Web Slinging Simulator</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #05070f;
            font-family: monospace;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            margin-top: -6px;
            margin-left: -6px;
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            pointer-events: none;
            transition: border-color 0.15s, transform 0.15s;
        }
        #crosshair.locked {
            border-color: #ff0055;
            transform: scale(1.4);
        }
        #click-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 7, 15, 0.85);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 10;
        }
        #click-overlay h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        #hud {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #00e5ff;
            font-size: 14px;
            pointer-events: none;
            line-height: 1.6;
            text-shadow: 0 0 5px rgba(0, 229, 255, 0.5);
        }
    </style>
</head>
<body>
    <div id="crosshair"></div>

    <div id="click-overlay">
        <h1>CLICK TO START</h1>
        <p>[W, A, S, D] Move | [SPACE] Jump / Wall Jump</p>
        <p>[LEFT CLICK] Hold to Web Swing</p>
    </div>

    <div id="hud">
        <div id="speed-info">SPEED: 0 MPH</div>
        <div id="target-info">TARGET: NONE</div>
    </div>

    <!-- Three.js and PointerLockControls dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

    <!-- Main Game Script -->
    <script src="main.js"></script>
</body>
</html>
